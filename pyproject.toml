[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "traceguard"
version = "1.0.0"
description = "Deterministic containment and tamper-evident compliance."
readme = "README.md"
requires-python = ">=3.8"
dependencies = ["fpdf2>=2.7.0", "pytest>=7.0.0"]

[project.scripts]
traceguard = "cli:main"

[tool.setuptools]
packages = ["src"]
py-modules = ["cli"]
