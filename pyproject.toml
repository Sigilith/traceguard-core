[build-system]
requires = ["setuptools>=61.0.0"]
build-backend = "setuptools.build_meta"

[project]
name = "traceguard-core"
version = "0.1.4"
description = "Deterministic zero-trust runtime and evidence demonstrator for autonomous AI agent pipelines."
readme = "README.md"
authors = [
    { name = "Sigilith", email = "sigilith@github.com" }
]
license = { text = "MIT" }
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Topic :: Security",
    "Topic :: Software Development :: Libraries :: Application Frameworks",
]
keywords = ["zero-trust", "runtime", "ledger", "cryptographic", "audit", "axiomos"]
requires-python = ">=3.8"

[project.urls]
Homepage = "https://github.com/Sigilith/traceguard-core"
Repository = "https://github.com/Sigilith/traceguard-core"
