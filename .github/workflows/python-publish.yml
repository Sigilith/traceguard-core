name: Verify and publish Python package

on:
  pull_request:
  push:
    branches: [main]
  release:
    types: [published]

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install project and test dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[test]"
      - name: Run package tests
        run: python -m pytest -q tests/test_engine_extra.py tests/test_mcp_gate.py

  build:
    needs: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install build and validation tools
        run: python -m pip install --upgrade build twine
      - name: Build release distributions
        run: python -m build --sdist --wheel --outdir package-dist
      - name: Validate built distributions
        run: python -m twine check package-dist/*.whl package-dist/*.tar.gz
      - name: Build Glama MCP container
        run: docker build --tag traceguard-core-glama .
      - uses: actions/upload-artifact@v4
        with:
          name: release-dists
          path: package-dist/

  publish:
    if: github.event_name == 'release'
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: pypi
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: release-dists
          path: dist/
      - name: Publish to PyPI with Trusted Publishing
        uses: pypa/gh-action-pypi-publish@release/v1
        with:
          packages-dir: dist/
