[build-system]
requires = ["setuptools>=61.0.0"]
build-backend = "setuptools.build_meta"

[project]
name = "traceguard-core"
version = "0.1.7"
description = "Action governance, tamper-evident evidence, and an optional MCP policy gate."
readme = "README.md"
authors = [{ name = "Sigilith", email = "sigilith@github.com" }]
license = { text = "MIT" }
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Security",
    "Topic :: Software Development :: Libraries :: Application Frameworks",
]
keywords = ["zero-trust", "runtime", "ledger", "cryptographic", "audit", "axiomos", "mcp"]
requires-python = ">=3.10"
dependencies = ["mcp"]

[project.optional-dependencies]
test = ["pytest>=7", "pytest-asyncio>=0.21"]

[project.urls]
Homepage = "https://github.com/Sigilith/traceguard-core"
Repository = "https://github.com/Sigilith/traceguard-core"

[project.scripts]
traceguard-core = "traceguard_core.mcp_server:entry_point"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]
include = ["traceguard", "traceguard.*", "traceguard_core", "traceguard_core.*"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
asyncio_mode = "auto"
